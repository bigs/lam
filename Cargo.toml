[workspace]
members = [
    "crates/lam",
    "crates/lam-agents",
    "crates/lam-batteries",
    "crates/lam-code",
    "crates/lam-core",
    "crates/lam-deno",
    "crates/lam-openai",
    "crates/lam-redb",
    "crates/lam-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "=0.22.1"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_core = "=0.409.0"
deno_error = "=0.7.1"
futures-core = "=0.3.33"
futures-util = "=0.3.33"
nix = { version = "=0.30.1", features = ["fs", "process", "signal"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
redb = "=4.1.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "=3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
tui-markdown = { version = "=0.3.9", default-features = false }
unicode-width = "=0.2.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# The journal store and checkpoint compression run hot at boot and teardown;
# unoptimized dev builds make a clean 400 MiB journal open take seconds
# instead of tens of milliseconds. Optimize just those dependencies.
[profile.dev.package.redb]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3
