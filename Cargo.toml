[workspace]
members = [
    "crates/lam",
    "crates/lam-core",
    "crates/lam-deno",
    "crates/lam-redb",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_core = "=0.409.0"
deno_error = "=0.7.1"
futures-core = "=0.3.33"
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt", "sync"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
