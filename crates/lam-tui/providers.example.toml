default_model = "openai/gpt-5.6-luna"

# Codex-enabled ChatGPT subscription — no API key.
# Sign in first: `lam-agent login openai`
[[providers]]
name = "codex"
type = "openai-codex"

# Codex subscription standard window is 272k (not the Platform API ~1.05M).
# Source: openai/codex models.json context_window for gpt-5.6-*.
[[providers.models]]
id = "gpt-5.6-sol"
name = "GPT-5.6 Sol (Codex subscription)"
context_window = 272000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

[providers.models.extra_body.reasoning]
summary = "auto"

[[providers.models]]
id = "gpt-5.6-terra"
name = "GPT-5.6 Terra (Codex subscription)"
context_window = 272000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

[providers.models.extra_body.reasoning]
summary = "auto"

# SuperGrok / X Premium subscription — no API key.
# Sign in first: `lam-agent login xai`
[[providers]]
name = "xai"
type = "xai-supergrok"
# api_base defaults to https://cli-chat-proxy.grok.com/v1

[[providers.models]]
id = "grok-4.5"
name = "Grok 4.5"
context_window = 500000
efforts = ["low", "medium", "high"]

[[providers.models]]
id = "grok-build-0.1"
name = "Grok Build 0.1"
context_window = 256000
efforts = ["low", "medium", "high"]

[[providers]]
name = "openai"
type = "openai-responses"
api_key_env = "OPENAI_API_KEY"

[[providers.models]]
id = "gpt-5.6-luna"
name = "GPT-5.6 Luna"
context_window = 1050000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

# Request provider-visible reasoning summaries for this model. Effort is
# owned by /effort and is injected beside this field at request time.
[providers.models.extra_body.reasoning]
summary = "auto"

[[providers.models]]
id = "gpt-5.6-sol"
name = "GPT-5.6 Sol"
context_window = 1050000
efforts = ["none", "low", "medium", "high", "xhigh", "max"]

